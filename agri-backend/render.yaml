services:
  - type: web
    name: agrimart-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://yivhlkzvlwxaomdvbuzm.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
